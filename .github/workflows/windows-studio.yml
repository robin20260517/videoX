name: Windows Studio

on:
  push:
    branches:
      - main
      - feat/brazil-ugc-studio
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-startup:
    name: Windows one-click smoke test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-studio.txt
          npm install --global pnpm@9.12.0
          pnpm --dir studio-web install --frozen-lockfile
      - name: Run studio tests
        shell: pwsh
        run: |
          python -m pytest tests/studio -q
          pnpm --dir studio-web test
      - name: Create synthetic built-in references for the startup check
        shell: pwsh
        run: python scripts/seed_windows_ci_references.py
      - name: Build and package Windows ZIP
        shell: pwsh
        run: python scripts/package_studio.py
      - name: Test Chinese one-click startup from extracted ZIP
        shell: pwsh
        run: ./scripts/test-windows-studio.ps1
